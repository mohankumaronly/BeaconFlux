<!doctype html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>BeaconFlux — Self-hosted chat for local Ollama</title>
    <meta
      name="description"
      content="BeaconFlux is a private, self-hosted chat interface for local Ollama models. Postgres persistence, SSE streaming, encrypted provider keys, one Docker command."
    />
    <meta property="og:title" content="BeaconFlux — Self-hosted chat for local Ollama" />
    <meta
      property="og:description"
      content="Your private ChatGPT on your own hardware. One Docker command. Zero cloud."
    />
    <meta property="og:type" content="website" />
    <meta name="theme-color" content="#0B0F14" />

    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap"
      rel="stylesheet"
    />

    <!-- Prevent theme flash: apply persisted theme before paint -->
    <script>
      (function () {
        try {
          var stored = localStorage.getItem('theme');
          var systemDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
          var isDark = stored ? stored === 'dark' : systemDark;
          document.documentElement.classList.toggle('dark', isDark);
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
